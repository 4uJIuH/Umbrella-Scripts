name: release

on:
  push:
    tags: ["*-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, e.g. auto-shackleshot-v1.0.0"
        required: true

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: notes
        id: notes
        run: python .github/release_notes.py "$TAG"

      - uses: softprops/action-gh-release@v2
        if: steps.notes.outputs.found == 'true'
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.notes.outputs.path }}
          name: ${{ steps.notes.outputs.title }} ${{ steps.notes.outputs.version }}
          body_path: body.md

      - name: version manifest
        if: steps.notes.outputs.manifest != ''
        run: |
          git fetch --depth 1 origin main
          git checkout -B main origin/main
          python .github/release_notes.py "$TAG" --manifest "$GITHUB_SHA"
          git config user.name github-actions
          git config user.email actions@github.com
          git add scripts
          if ! git diff --cached --quiet; then
            git commit -m "${{ steps.notes.outputs.manifest }} ${TAG##*-v}: version manifest"
            git pull --rebase
            for attempt in 1 2 3 4 5; do
              if git push origin main; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Failed to push version manifest after 5 attempts" >&2
                exit 1
              fi
              sleep "$attempt"
              git pull --rebase origin main
            done
          fi

      - name: pages
        if: steps.notes.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run readme.yml --ref main
